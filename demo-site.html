<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor & Co. — Demo storefront</title><style>
*{box-sizing:border-box}body{margin:0;color:#2e352e;background:#f6f5f0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:white;display:flex;align-items:center;justify-content:space-between;padding:24px min(7vw,100px);border-bottom:1px solid #e9e6e0}.brand{font-size:24px;font-family:Georgia,serif;letter-spacing:1.5px;font-weight:600}header a,.menu{font-size:14px;color:#6d756f;text-decoration:none;display:flex;gap:25px}.hero{min-height:72vh;display:grid;grid-template-columns:1.07fr .93fr;align-items:center;gap:60px;padding:45px min(7vw,100px)}.eyebrow{color:#a48c72;letter-spacing:.15em;font-size:12px;font-weight:700}.hero h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(50px,6.5vw,90px);letter-spacing:-3px;line-height:1.02;margin:20px 0}.hero p{font-size:18px;color:#697269;max-width:440px;line-height:1.7}.hero a{margin-top:18px;padding:15px 24px;display:inline-block;background:#2d483d;color:white;text-decoration:none;border-radius:5px}.illustration{min-height:475px;border-radius:180px 180px 16px 16px;background:radial-gradient(circle at 30% 20%,#e6dfbf 0,transparent 32%),linear-gradient(140deg,#bcc5af,#768a79 70%,#40564c);display:grid;place-items:center;box-shadow:0 24px 60px #7a857b30}.vase{font-size:140px;filter:drop-shadow(0 17px 8px #273c302d)}.foot{padding:25px min(7vw,100px);background:#e9ece6;color:#5d6f62}.foot button{margin-left:12px;background:white;border:1px solid #cdd7ca;border-radius:7px;padding:8px 12px;cursor:pointer} @media(max-width:690px){.hero{grid-template-columns:1fr}.illustration{min-height:280px}.hero h1{letter-spacing:-1px}.menu{display:none}}
</style></head><body><header><div class="brand">HARBOR & CO.</div><nav class="menu"><a href="#collection">Home</a><a href="#collection">Collection</a><a href="#collection">Journal</a></nav></header>
<main class="hero"><section><div class="eyebrow">SIMPLE, TIMELESS OBJECTS</div><h1>Make room for beautiful living.</h1><p>Thoughtfully considered objects for everyday rituals, quiet mornings, and everything in between.</p><a href="#collection">Explore the collection ↗</a></section><div class="illustration" role="img" aria-label="Decorative green botanical illustration"><span class="vase">✿</span></div></main>
<footer class="foot" id="collection">Local demo storefront. Visit the installer to copy the code. <button id="reopen-form">Reopen sign-up pop-up</button> <button id="see-leads">View local sign-ups</button><span id="leads" aria-live="polite"></span></footer>
<script async src="./forms/v2.js" data-workspace="harborandco" data-form="homepage-popup"></script>
<script>document.getElementById('reopen-form').onclick=()=>{sessionStorage.removeItem('loopo-popup-seen:harborandco:homepage-popup');location.reload()};document.getElementById('see-leads').onclick=()=>{let v=[];try{v=JSON.parse(localStorage.getItem('loopo-demo-leads')||'[]')}catch{}document.getElementById('leads').textContent=v.length?` ${v.length} local sign-up(s): `+v.map(x=>x.email).join(', '):' No local sign-ups yet.'};</script>
</body></html>
